# server-блоки Alma AI для общего шлюза (контейнер app-gateway-nginx).
# Добавляются В КОНЕЦ его nginx.conf; существующие блоки не трогаются.
# Шлюз должен быть подключён к сети alma_edge:
#   docker network connect alma_edge app-gateway-nginx
# Upstream задан через переменную: если контейнеры Alma недоступны, nginx
# всё равно стартует (отвечают 502 только домены Alma), другие сайты целы.

# ---- ЭТАП 1: HTTP + выпуск сертификатов (webroot) ----
server {
    listen 80;
    listen [::]:80;
    server_name almaai.kz www.almaai.kz app.almaai.kz check.almaai.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- ЭТАП 2: лендинг (после выпуска сертификата almaai.kz) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.almaai.kz;
    ssl_certificate     /etc/letsencrypt/live/almaai.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almaai.kz/privkey.pem;
    return 301 https://almaai.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name almaai.kz;
    ssl_certificate     /etc/letsencrypt/live/almaai.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almaai.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s;
    set $alma_landing http://alma-landing:80;
    location / {
        proxy_pass $alma_landing;
        proxy_set_header Host $host;
    }
}

# ---- ЭТАП 3: кабинет и режим руководителя (после DNS и сертификата app.almaai.kz) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.almaai.kz check.almaai.kz;
    ssl_certificate     /etc/letsencrypt/live/app.almaai.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.almaai.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # CSP, X-Frame-Options и остальное выставляет само приложение.

    client_max_body_size 1m;
    access_log /var/log/nginx/alma.access.log;

    resolver 127.0.0.11 valid=10s;
    set $alma_app http://alma-app:4100;
    location / {
        proxy_pass $alma_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                      # по нему приложение отличает check.*
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;    # шлюз — край сети: чужой X-Forwarded-For не принимаем
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
